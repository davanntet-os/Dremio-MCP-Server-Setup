name: dremio-mcp

services:
  dremio-init:
    image: python:3.13-alpine
    container_name: dremio-init
    depends_on:
      dremio:
        condition: service_healthy
    environment:
      DREMIO_URI: http://173.212.237.61:9047
      DREMIO_USER: amdin
      DREMIO_PASSWORD: FatherOfTheYear()12
      PAT_FILE: /shared/pat.txt
    volumes:
      - ./dremio-init.py:/init.py:ro
      - pat-shared:/shared
    command: ["python", "/init.py"]

  dremio-mcp:
    build: ./dremio-mcp
    container_name: dremio-mcp
    depends_on:
      dremio:
        condition: service_healthy
      dremio-init:
        condition: service_completed_successfully
    ports:
      - "8168:8000"    # MCP streamable-HTTP endpoint: http://<host>:8000/mcp
    environment:
      DREMIOAI_DREMIO__URI: http://173.212.237.61:9047
      DREMIOAI_DREMIO__PAT: "@/shared/pat.txt"
      DREMIOAI_TOOLS__SERVER_MODE: FOR_DATA_PATTERNS
    volumes:
      - pat-shared:/shared:ro
    command:
      - dremio-mcp-server
      - run
      - --enable-streaming-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --disable-dns-rebinding-protection
    restart: unless-stopped

volumes:
  dremio-data:
  pat-shared:
